<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; height: 100%;
            background: transparent;
            font-family: Arial, sans-serif; 
            overflow: hidden;
        }
        .widget {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 140px;
            background: rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }
        .label {
            position: absolute;
            top: 0; left: 0;
            width: 800px; height: 140px;
            background: #ffcc00;
            color: #000;
            font-size: 52px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            letter-spacing: 3px;
        }
        .ticker-area {
            position: absolute;
            top: 0; left: 280px; right: 0;
            height: 140px;
            overflow: hidden;
            z-index: 5;
        }
        .ticker {
            position: absolute;
            top: 0; left: 100%;
            height: 140px;
            line-height: 140px;
            white-space: nowrap;
        }
        .item {
            display: inline-block;
            padding: 0 50px;
            font-size: 48px;
            color: #ffffff;
            font-weight: 700;
            vertical-align: middle;
        }
        .item::before {
            content: '● ';
            color: #ffcc00;
            font-size: 24px;
        }
        .source { color: #ffcc00; font-weight: 700; margin-right: 12px; font-size: 44px; }
        .time { color: rgba(255,255,255,0.7); font-size: 38px; margin-left: 15px; }
    </style>
</head>
<body>
    <div class="widget">
        <div class="label">НОВОСТИ</div>
        <div class="ticker-area">
            <div class="ticker" id="ticker">
                <div class="item">Загрузка...</div>
            </div>
        </div>
    </div>
    <script>
        const API_KEY = '4c5d9c7e414a4d90b5ddc94280b7a78d';
        const ticker = document.getElementById('ticker');
        const tickerArea = document.querySelector('.ticker-area');
        const SPEED = 80;
        let currentPos = 0, tickerWidth = 0, areaWidth = 0, lastTime = 0, isRunning = false;

        const TEST_NEWS = [
            'В Якутске открылся новый автосалон ASIAMOTORS',
            'Скидки на автомобили до 30% только до конца месяца',
            'Кредит от 4.9% годовых на все модели',
            'Trade-in: обменяйте старый авто на новый с выгодой',
            'Бесплатное ТО при покупке автомобиля',
            'Новые поступления: OMODA, JAECOO, EXEED',
            'Специальные условия для корпоративных клиентов',
            'Тест-драйв любой модели бесплатно'
        ];

        function buildTicker(newsItems) {
            let html = '';
            newsItems.forEach(item => {
                if (typeof item === 'string') {
                    html += '<div class="item">' + item + '</div>';
                } else {
                    const title = (item.title || '').replace(/</g, '&lt;');
                    const source = item.source || '';
                    const timeStr = item.publish_date 
                        ? new Date(item.publish_date).toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'}) 
                        : '';
                    html += '<div class="item">';
                    if (source) html += '<span class="source">' + source + ':</span>';
                    html += title;
                    if (timeStr) html += '<span class="time">[' + timeStr + ']</span>';
                    html += '</div>';
                }
            });
            ticker.innerHTML = html + html;
        }

        function startAnimation() {
            if (isRunning) return;
            isRunning = true;
            tickerWidth = ticker.offsetWidth;
            areaWidth = tickerArea.offsetWidth;
            currentPos = areaWidth;
            ticker.style.left = currentPos + 'px';
            lastTime = performance.now();
            requestAnimationFrame(animate);
        }

        function animate(time) {
            const delta = (time - lastTime) / 1000;
            lastTime = time;
            currentPos -= SPEED * delta;
            if (currentPos <= -tickerWidth / 2) currentPos = areaWidth;
            ticker.style.left = currentPos + 'px';
            requestAnimationFrame(animate);
        }

        async function loadNews() {
            try {
                const url = `https://api.worldnewsapi.com/search-news?language=ru&sort-by=date&api-key=${API_KEY}`;
                const response = await fetch(url, { cache: 'no-store' });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                const newsList = data.news || [];
                if (newsList.length > 0) {
                    buildTicker(newsList.slice(0, 15));
                } else {
                    buildTicker(TEST_NEWS);
                }
                setTimeout(startAnimation, 100);
            } catch (error) {
                buildTicker(TEST_NEWS);
                setTimeout(startAnimation, 100);
            }
        }

        loadNews();
        setInterval(loadNews, 900000);
    </script>
</body>
</html>
